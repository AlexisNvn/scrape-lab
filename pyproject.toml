[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scrapeprint"
version = "0.1.0"
description = "Correctness-first browser scraping benchmarks on web-scraping.dev"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["playwright>=1.55,<2", "typer>=0.16,<1", "pydantic>=2.11,<3", "psutil>=7,<8"]

[project.scripts]
scrapeprint = "scrapeprint.cli:app"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
